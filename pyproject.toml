[project]
name = "chemcomp"
version = "0.1.0"
description = "Chemical computing simulation & research prototypes"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemcomp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # macOSで .pth が hidden になっても import できるように
